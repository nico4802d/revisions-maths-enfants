name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk \
              --title "Révisions Maths $GITHUB_REF_NAME" \
              --notes "APK debug de la version $GITHUB_REF_NAME. Voir CHANGELOG.md pour le détail des évolutions. Installation directe sur le téléphone (autoriser les sources inconnues)."
          else
            gh release create latest-debug --prerelease \
              --title "APK debug (dernier build)" \
              --notes "APK debug généré automatiquement par le dernier push. À installer directement sur le téléphone (autoriser les sources inconnues)." \
              || true
            gh release upload latest-debug app/build/outputs/apk/debug/app-debug.apk --clobber
          fi
